name: Keep Render warm

on:
  schedule:
    # Every 5 minutes
    - cron: "*/5 * * * *"
  workflow_dispatch: # manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sSf --max-time 10 https://yentellect.onrender.com/health || echo "Ping failed (expected if service is cold-starting)"