[project]
name = "yentellect-backend"
version = "0.1.0"
description = "Yentellect cognitive development platform backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.110.1",
    "uvicorn[standard]==0.29.0",
    "langgraph==0.2.14",
    "groq==0.11.0",
    "networkx==3.3",
    "spacy==3.7.5",
    "nltk==3.8.1",
    "textstat==0.7.3",
    "sentence-transformers==3.0.1",
    "scikit-learn==1.5.0",
    "shap==0.44.1",
    "pydantic==2.7.1",
    "pydantic-settings==2.3.3",
    "python-dotenv==1.0.1",
    "sqlite-utils==3.37",
    "aiofiles==23.2.1",
    "httpx==0.27.0",
    "numpy==1.26.4",
    "scipy>=1.11.0",
    "pandas==2.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.1",
    "pytest-asyncio==0.23.3",
    "pytest-cov==5.0.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "black==24.4.0",
]

[tool.uv]
dev-dependencies = [
    "pytest==8.2.1",
    "pytest-asyncio==0.23.3",
    "pytest-cov==5.0.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "black==24.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default arguments
]
format.quote-style = "double"
format.indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=backend.core --cov-report=term-missing"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"