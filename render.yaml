services:
  - type: web
    name: yentellect-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_sm
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: FRONTEND_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false